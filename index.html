<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
      integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" href="./imgs/logo.png" type="image/png" />
    <meta name="description" content="Classic Snake in the browser: eat the food, grow longer and do not hit the walls. Play with W A S D or the on-screen keys." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Classic Snake" />
    <meta property="og:description" content="Classic Snake in the browser: eat the food, grow longer and do not hit the walls. Play with W A S D or the on-screen keys." />
    <meta property="og:url" content="https://snake-by-ivan-kuper.netlify.app/" />
    <meta property="og:image" content="https://snake-by-ivan-kuper.netlify.app/og.jpg" />
    <meta name="theme-color" content="#212529" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Classic Snake</title>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- NavBar -->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html"
          ><img class="logo" src="imgs/logo.png" alt="" width="26" height="32" />
          <span class="logoSpan">Classic Snake</span></a
        >
        <a class="portfolio-link" href="https://ivankuper.github.io/"
          ><span class="d-none d-sm-inline">Ivan Kuper &middot; </span>Portfolio
          <img class="profilePic" src="imgs/Profile.jpg" alt="" width="40" height="40"
        /></a>
      </div>
    </nav>
    <!-- End of Navbar -->
    <main>
      <h1 class="visually-hidden">Classic Snake</h1>
      <div class="scorebar" aria-live="polite">
        <span>Score <strong id="score">0</strong></span>
        <span>Best <strong id="best">0</strong></span>
      </div>
      <div id="app">
        <div class="keyboard">
          <h2>Moving keys</h2>
          <div class="movingKeys">
            <button type="button" id="w">W &ndash; move up</button>
            <button type="button" id="s">S &ndash; move down</button>
            <button type="button" id="a">A &ndash; move left</button>
            <button type="button" id="d">D &ndash; move right</button>
          </div>
          <p class="hint">Arrow keys work too. On a phone, swipe on the board.</p>
        </div>
        <div class="board">
          <div id="grid" role="img" aria-label="Snake board"></div>
          <div id="overlay" class="overlay show">
            <p id="overlayText">Press a key, swipe or tap Start</p>
            <button type="button" id="startBtn">Start</button>
          </div>
        </div>
      </div>
      <div id="btn"><button id="resetBtn" type="button">New Game</button></div>
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto pt-3">
      <p class="copyright">
        Coded & Designed By:
        <strong
          ><a href="https://ivankuper.github.io/" target="_blank"
            >Ivan Kuper</a
          ></strong
        >
        © All rights reserved.
      </p>
      <div class="socials">
        <a aria-label="Facebook"
          class="link"
          target="_blank"
          href="https://www.facebook.com/ivankuper7"
          ><i class="socials fab fa-facebook fa-2x px-1"></i
        ></a>
        <a aria-label="Instagram"
          class="link"
          target="_blank"
          href="https://www.instagram.com/ivan_kuper/"
          ><i class="socials fab fa-instagram fa-2x px-1"></i
        ></a>
        <a aria-label="Twitter" class="link" target="_blank" href="https://twitter.com/Ivan7Kuper"
          ><i class="socials fab fa-twitter fa-2x px-1"></i
        ></a>
        <a aria-label="LinkedIn"
          class="link"
          target="_blank"
          href="https://www.linkedin.com/in/ivankuper/"
          ><i class="fa-brands fa-linkedin fa-2x px-1"></i
        ></a>
      </div>
    </footer>
    <!-- End  Footer -->
    <script src="./app.js"></script>
  </body>
</html>
